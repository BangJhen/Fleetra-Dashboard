services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      FLEETRA_DATA_BACKEND: file
      FLEETRA_DATA_DIR: /app/.data
    volumes:
      - fleetra_data:/app/.data
    restart: unless-stopped

volumes:
  fleetra_data: